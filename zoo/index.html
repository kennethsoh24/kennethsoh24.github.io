<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>灰林動物園 · 遊客須知</title>
<meta name="description" content="動物園規則怪談像素RPG：霧入面嘅動物園、戴兔頭套排隊嘅人、唔應該存在嘅水族館。跟住《遊客須知》，搵返三年前走失嘅細妹。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151513; --cream:#e8e4d8; --paper:#ddd6c4; --bone:#d4c79c; --red:#8e1c1c;
  --sage:#8fa89c; --moss:#2f4a35; --fog:#9aa298;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;filter:saturate(.72) contrast(1.06)}
.hidden{display:none!important}
.pix{font-family:'Press Start 2P',monospace}
.serif{font-family:'Noto Serif TC',serif}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink)}
.btn{font:inherit;font-weight:900;background:var(--bone);border:3px solid var(--ink);border-radius:8px;
  box-shadow:0 4px 0 var(--ink);padding:10px 18px;cursor:pointer;font-size:16px;color:var(--ink);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn.ghost{background:var(--cream)}
.btn.red{background:var(--red);color:#f3ece0}
.btn.sage{background:var(--sage)}
.btn:disabled{filter:grayscale(1) brightness(.75);cursor:not-allowed}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hudL{position:absolute;left:12px;top:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:150px}
#clockRow{display:flex;align-items:baseline;gap:10px}
#clock{font-size:16px}
#clock.glitch{color:var(--red);animation:jit2 .15s steps(2) infinite}
#nightLbl{font-size:12px;font-weight:900;background:var(--ink);color:var(--bone);border-radius:5px;padding:1px 7px}
#sanRow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
#sanBar{flex:1;height:12px;border:2px solid var(--ink);border-radius:5px;background:#3a3a36;overflow:hidden}
#sanFill{display:block;height:100%;width:100%;background:var(--sage);transition:width .2s}
#sanFill.mid{background:var(--bone)} #sanFill.low{background:#c23a2a;animation:pulse .6s infinite}
#hudR{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#coinBox{padding:6px 12px;font-weight:900;font-size:15px}
#charmBox{padding:6px 10px;font-weight:900;font-size:13px}
#zoneTag{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:900;font-size:14px;color:#eee;
  text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s;letter-spacing:.2em;font-family:'Noto Serif TC',serif}
#zoneTag.show{opacity:1}
#hint{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);padding:6px 14px;font-weight:900;font-size:14px;z-index:6;pointer-events:none;white-space:nowrap}
#hint kbd{font-family:'Press Start 2P',monospace;font-size:10px;background:var(--bone);border:2px solid var(--ink);border-radius:5px;padding:2px 5px;margin-right:6px}
#toasts{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none;width:min(92vw,520px)}
.toast{padding:7px 14px;font-weight:900;font-size:14px;animation:tin .25s ease-out;text-align:center;line-height:1.5}
.toast.good{background:#dfe8dc} .toast.bad{background:#e9d3cf;color:#6e1010} .toast.gold{background:var(--bone)}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .4s}
#cast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:9;width:min(92vw,560px);padding:10px 14px;
  background:#22281f;color:#dfe6d6;border:3px solid #000;border-radius:8px;box-shadow:0 5px 0 #000;font-weight:700;font-size:15px;line-height:1.6;pointer-events:none}
#cast b{color:var(--sage);margin-right:6px}
#cast.fake{background:#2a0e10;color:#f0c8c8;animation:jit .2s steps(2) infinite}
#cast.fake b{color:#d94a3a}
@keyframes jit{0%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 1px),-1px)}100%{transform:translate(calc(-50% - 1px),1px)}}
@keyframes jit2{50%{transform:translate(1px,-1px)}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@keyframes pulse{50%{filter:brightness(1.6)}}

#joy{position:fixed;left:0;bottom:0;width:50%;height:55%;z-index:4;touch-action:none}
#joyBase{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);transform:translate(-50%,-50%);display:none}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(212,199,156,.85);border:3px solid var(--ink);left:50%;top:50%;transform:translate(-50%,-50%)}
#actBtn{position:fixed;right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;z-index:6;font-size:20px;padding:0}

#dlg{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom))}
.dbox{width:min(760px,100%);display:flex;gap:12px;padding:12px;position:relative;cursor:pointer;min-height:130px;background:#e3ded0}
#portWrap{flex:0 0 auto;width:104px;height:104px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(#8e968a,#4d554b);overflow:hidden}
#portWrap.none{display:none}
#portrait{width:100%;height:100%;image-rendering:pixelated;filter:saturate(.75)}
.dright{flex:1;min-width:0;display:flex;flex-direction:column}
#dname{align-self:flex-start;background:var(--bone);border:3px solid var(--ink);border-radius:7px;padding:1px 10px;font-weight:900;font-size:14px;margin:-26px 0 6px;box-shadow:0 3px 0 var(--ink)}
#dname:empty{display:none}
#dtext{font-size:17px;font-weight:700;line-height:1.65;min-height:3.3em;white-space:pre-wrap}
#dtext.sys{color:#3d3a34;font-family:'Noto Serif TC',serif}
#dchoices{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#dchoices .btn{text-align:left;font-size:15px;padding:8px 12px}
#dchoices .btn span{font-family:'Press Start 2P';font-size:9px;margin-right:8px;opacity:.6}
#dnext{position:absolute;right:14px;bottom:8px;font-size:12px;animation:pulse 1s infinite}

.modal{position:fixed;inset:0;z-index:30;background:rgba(8,10,8,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.paper{background:var(--paper);border:3px solid var(--ink);border-radius:4px;box-shadow:0 6px 0 var(--ink),inset 0 0 50px rgba(90,80,50,.35);
  width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;position:relative}
.tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tab{font:inherit;font-weight:900;font-size:13px;padding:6px 12px;border:3px solid var(--ink);border-bottom:0;border-radius:7px 7px 0 0;background:#c4bca6;cursor:pointer;color:var(--ink)}
.tab.on{background:#f1ece0}
#bookBody{background:#f1ece0;border-top:3px solid var(--ink);padding:16px 18px;overflow:auto;flex:1;min-height:0}
#bookFoot{padding:10px 12px;display:flex;justify-content:flex-end;gap:8px;border-top:3px dashed rgba(0,0,0,.15)}
.rh{text-align:center;margin-bottom:12px}
.rh h2{margin:0;font-size:21px;font-weight:900;letter-spacing:.14em;font-family:'Noto Serif TC',serif}
.rh small{display:block;font-size:12px;color:#5b5444;margin-top:3px}
.rule{display:flex;gap:10px;padding:8px 2px;border-bottom:1px dashed #b9b09a;font-size:15px;line-height:1.7;font-weight:700}
.rule b{flex:0 0 26px;font-family:'Press Start 2P';font-size:11px;padding-top:4px}
.rule.alt{color:#4a1818;letter-spacing:.04em}
.rule .new{display:inline-block;font-size:10px;font-weight:900;background:var(--red);color:#fff;border-radius:3px;padding:0 5px;margin-left:6px;transform:rotate(-4deg);vertical-align:2px}
.stampbox{margin-top:12px;text-align:right;font-size:12px;color:#6a6252}
.stampbox i{display:inline-block;border:2px solid var(--red);color:var(--red);padding:2px 8px;transform:rotate(-6deg);font-style:normal;font-weight:900;border-radius:3px}
.note{background:#fff;border:2px solid #cfc6ad;padding:12px 14px;margin-bottom:12px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.12);
  background-image:repeating-linear-gradient(#fbfaf5 0 25px,#d8e0e4 25px 26px)}
.note p{margin:0;font-size:16px;line-height:26px;color:#9b1f1a;font-weight:700}
.note.fake{transform:rotate(1deg)} .note.fake p{color:#2b2232;font-style:italic;letter-spacing:.08em}
.note .sig{text-align:right;color:#9b1f1a;font-weight:900}
.note .when{font-size:11px;color:#888;font-weight:700;margin-bottom:4px}
.empty{color:#7a7262;text-align:center;padding:28px 0;font-weight:700}
#noteModal .paper{width:min(460px,100%)}

#kui{position:fixed;inset:0;z-index:10;pointer-events:none}
#kTop{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#kTop .panel{padding:6px 12px;font-weight:900;font-size:14px;white-space:nowrap}
#kTime{font-family:'Press Start 2P';font-size:12px}
#kBot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
#kTray{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:900;font-size:13px}
#kTraySlots{display:flex;gap:4px}
.tslot{width:38px;height:38px;border:2px dashed #8a8270;border-radius:7px;display:grid;place-items:center;background:#f4f0e6}
.tslot canvas{width:30px;height:30px;image-rendering:pixelated}
#kBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ibtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:6px 8px 8px;overflow:hidden}
.ibtn canvas{width:36px;height:36px;image-rendering:pixelated}
.ibtn small{font-size:12px}
.ibtn i{position:absolute;left:0;bottom:0;height:5px;background:var(--moss);width:0}
#kFree.on{background:#e3b3aa}
#kHelp{font-size:12px;color:#eee;text-shadow:0 1px 0 #000;font-weight:700;text-align:center}

.screen{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#title{flex-direction:column;gap:14px;text-align:center;justify-content:flex-start;padding-top:9vh}
.logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(38px,9vw,72px);color:#ece6d6;line-height:1.1;letter-spacing:.12em;
  text-shadow:0 3px 0 #000,0 0 30px rgba(0,0,0,.6)}
.logo small{display:block;font-size:.4em;color:#c94a3a;margin-top:10px;letter-spacing:.45em}
.sub{font-family:'Press Start 2P';font-size:9px;color:#cfd6c8;letter-spacing:.2em;text-shadow:0 2px 0 #000}
.titleBtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:auto;margin-bottom:6vh}
.titleBtns .btn{min-width:220px;font-size:18px}
.keys{color:#ddd;font-size:12px;font-weight:700;text-shadow:0 1px 0 #000;line-height:1.8}
.mcard{width:min(720px,100%);padding:16px 16px 14px;max-height:100%;overflow:auto}
.mcard h2{margin:0 0 4px;font-size:24px;font-weight:900;font-family:'Noto Serif TC',serif}
.mcard .k{font-family:'Press Start 2P';font-size:9px;color:#6a6252;letter-spacing:.2em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:#f4f0e6;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-weight:900}
.stat small{display:block;font-size:11px;color:#6a6252}
.stat b{font-size:20px}
.mtalk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.mtalk canvas{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(#a8ae9e,#6a7266);flex:0 0 auto;filter:saturate(.75)}
.bubble{background:#f4f0e6;border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.6}
.bubble b{display:block;font-size:12px;color:#7a3a2a}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.item{display:flex;gap:10px;align-items:center;background:#f4f0e6;border:2px solid var(--ink);border-radius:8px;padding:8px}
.item .ic{font-size:26px;width:36px;text-align:center}
.item .tx{flex:1;min-width:0;font-size:12px;font-weight:700;color:#4b4538;line-height:1.4}
.item .tx b{display:block;font-size:14px;color:var(--ink)}
.item .btn{padding:6px 10px;font-size:13px;white-space:nowrap}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#ending{flex-direction:column}
.ecard{width:min(620px,100%);padding:20px;text-align:center}
.ecard .k{font-family:'Press Start 2P';font-size:10px;letter-spacing:.2em;color:#6a6252}
.ecard h2{font-size:30px;margin:8px 0 12px;font-weight:900;font-family:'Noto Serif TC',serif}
.ecard p{font-size:16px;line-height:1.85;font-weight:700;margin:0 0 10px}
#fade{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1;pointer-events:auto}
#fadeTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font-weight:900;font-size:20px;text-align:center;padding:20px;line-height:1.8;font-family:'Noto Serif TC',serif;white-space:pre-line}
#scare{position:fixed;inset:0;width:100%;height:100%;z-index:45;image-rendering:pixelated;pointer-events:none;background:#000;filter:saturate(.6) contrast(1.3)}
.shake{animation:shk .08s infinite}
@keyframes shk{0%{transform:translate(4px,-3px)}50%{transform:translate(-5px,4px)}100%{transform:translate(3px,5px)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%)}
#vign{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(140,0,10,.55) 100%)}
@media (max-width:560px){
  #hudL{min-width:128px;padding:6px 9px} #clock{font-size:13px}
  #dtext{font-size:15px} #portWrap{width:76px;height:76px} .dbox{min-height:110px}
  .ibtn{min-width:62px} #hint{bottom:30%}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div><div id="vign"></div>

<div id="hud" class="hidden">
  <div id="hudL" class="panel">
    <div id="clockRow"><span id="clock" class="pix">10:00</span><span id="nightLbl">第1日</span></div>
    <div id="sanRow">理智<div id="sanBar"><i id="sanFill"></i></div></div>
  </div>
  <div id="zoneTag"></div>
  <div id="hudR">
    <div id="charmBox" class="panel hidden">🐰 <b id="charmTxt">0</b></div>
    <div id="coinBox" class="panel">🪙 <b id="coinTxt">0</b></div>
    <button id="bookBtn" class="btn sm">📜 須知</button>
    <button id="muteBtn" class="btn sm ghost">🔊</button>
  </div>
</div>
<div id="toasts"></div>
<div id="cast" class="hidden"></div>
<div id="hint" class="panel hidden"></div>
<div id="joy" class="hidden"><div id="joyBase"><div id="joyKnob"></div></div></div>
<button id="actBtn" class="btn hidden">E</button>

<div id="dlg" class="hidden">
  <div class="dbox panel" id="dbox">
    <div id="portWrap"><canvas id="portrait" width="44" height="44"></canvas></div>
    <div class="dright"><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div></div>
    <div id="dnext">▼</div>
  </div>
</div>

<div id="book" class="modal hidden">
  <div class="paper">
    <div class="tabs" id="bookTabs"></div>
    <div id="bookBody"></div>
    <div id="bookFoot"><button class="btn" id="bookClose">收好佢</button></div>
  </div>
</div>
<div id="noteModal" class="modal hidden">
  <div class="paper">
    <div id="bookBody2" style="padding:18px;background:#f1ece0"></div>
    <div style="padding:10px 12px;display:flex;justify-content:flex-end;border-top:3px dashed rgba(0,0,0,.15)"><button class="btn" id="noteClose">收埋喺袋</button></div>
  </div>
</div>

<div id="kui" class="hidden">
  <div id="kTop">
    <div class="panel">⏱ <span id="kTime">60</span></div>
    <div class="panel">🪙 餵飼報酬 <b id="kEarn">0</b></div>
    <div class="panel">🥕 已餵 <b id="kServed">0</b></div>
  </div>
  <div id="kBot">
    <div id="kHelp">撳飼料放上托盤 → 撳動物餵佢　｜　唔啱嘅動物：撳「叫佢走」再撳佢</div>
    <div id="kTray" class="panel">托盤 <div id="kTraySlots"></div><button class="btn sm ghost" id="kClear">清空</button></div>
    <div id="kBtns"></div>
  </div>
</div>

<div id="title" class="screen hidden">
  <div class="logo">灰林動物園<small>遊 客 須 知</small></div>
  <div class="sub">GREYWOOD ZOO · VISITOR RULES</div>
  <div class="titleBtns">
    <button class="btn" id="btnNew">🎟️ 買飛入園</button>
    <button class="btn sage hidden" id="btnCont">繼續</button>
    <div class="keys">WASD／方向鍵 移動 · E／空白鍵 互動 · R 睇須知<br>手機：左邊拖動行路 · 右下角掣互動</div>
  </div>
</div>
<div id="morning" class="screen hidden"><div class="mcard panel" id="mcard"></div></div>
<div id="ending" class="screen hidden"><div class="ecard panel" id="ecard"></div></div>
<div id="fade"><div id="fadeTxt"></div></div>
<canvas id="scare" class="hidden" width="64" height="40"></canvas>

<script>
'use strict';
/* ============================================================
   灰林動物園 · 遊客須知 — a zoo rule-horror pixel RPG
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];

const cv=$('cv'),ctx=cv.getContext('2d');
const light=document.createElement('canvas'),lctx=light.getContext('2d');
let LW=240,LH=150,SC=4;
function resize(){
  SC=Math.max(2,Math.floor(Math.min(innerWidth/240,innerHeight/150)));
  LW=Math.ceil(innerWidth/SC);LH=Math.ceil(innerHeight/SC);
  cv.width=LW;cv.height=LH;light.width=LW;light.height=LH;
  cv.style.width=LW*SC+'px';cv.style.height=LH*SC+'px';ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

let G=ctx,SIL=null;
function r(x,y,w,h,c){G.fillStyle=SIL||c;G.fillRect(Math.round(x),Math.round(y),w,h);}
function circ(g,cx,cy,rad,c,ry){ry=ry??rad;g.fillStyle=c;
  for(let y=-ry;y<=ry;y++){const w=Math.round(rad*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1);}}
function shadow(g,x,y,w){circ(g,x,y,w||5,'rgba(0,0,0,.35)',2);}

/* ============================================================
   SPRITES (origin = feet centre)
   ============================================================ */
const SPR={};
SPR.player=o=>{ // visitor in grey hoodie with backpack

function blocked(x,y,rad){
  for(const b of BLOCKS){const cx=clamp(x,b.x,b.x+b.w),cy=clamp(y,b.y,b.y+b.h);if((x-cx)**2+(y-cy)**2<rad*rad)return true;}
  for(const c of CIRCLES){if((x-c.x)**2+(y-c.y)**2<(rad+c.r)**2)return true;}
  return y>WH-4;
}

const MIN_SEC=.5;
function newNight(){
  const N=NIGHTS[S.night];const maxSan=100+(S.upg.flask?25:0);
  R={time:0,san:maxSan,maxSan,earned:0,events:N.ev.map(e=>Object.assign({},e,{done:false})),
     busy:false,lampRed:false,redT:0,redGrace:0,redFailed:false,npc:null,queue:null,pickups:[],
     zone:'staff',kioskOpen:false,kioskDone:false,target:null,aq:false,eleOn:false,eleA:0,
     fakeBell:false,rested:false,gateLock:false,fakeWin:null,dawnSaid:false,kioskEarn:0,events_ok:0,events_bad:0,stepT:0,mirrorOn:false};
  const rr=rng(S.night*77+3);LAMPS.forEach(l=>{l.lit=rr()>.12;l.fl=rr()<.18?1:0;});
  const rnd=rng(S.night*131+Date.now()%1000);let tries=0;
  while(R.pickups.length<13&&tries++<3000){
    let x,y,onPath=rnd()<.55;
    if(onPath){const p=PATHS[rnd()*PATHS.length|0];x=p.x+4+rnd()*(p.w-8);y=p.y+4+rnd()*(p.h-8);}else{x=30+rnd()*700;y=30+rnd()*570;}
    if(blocked(x,y,6)||zoneAt(x,y)==='gate')continue;if(R.pickups.some(q=>dist(q.x,q.y,x,y)<40))continue;
    const L=LOST[rnd()*LOST.length|0];R.pickups.push({x,y,kind:'lost',name:L[0],ic:L[1],v:onPath?4+(rnd()*5|0):9+(rnd()*8|0),ph:rnd()*6});
  }
  const want=[];for(let n=1;n<=S.night;n++)for(const id of NIGHTS[n].notes)if((id!=='F'||n===S.night)&&(id!=='badge'||S.night===5))want.push(id);
  for(const id of want){
    if(id==='badge'){if(!S.badge)R.pickups.push({x:NOTE_POS.badge[0],y:NOTE_POS.badge[1],kind:'badge',ph:0});}
    else if(!S.notes[id])R.pickups.push({x:NOTE_POS[id][0],y:NOTE_POS[id][1],kind:'note',id,ph:0});
  }
  P.x=224;P.y=522;P.dir=0;P.face=Math.PI/2;
}

  if(R.fakeWin){if(R.time>R.fakeWin.until){if(R.fakeWin.z==='ferris')R.aq=false;R.fakeWin=null;}

      runScript(async()=>{await talk(['你嚟到'+zoneName(z)+'。呢度乜都冇。','……除咗一個背住你、戴住兔頭套、一直喺度等你嘅人。']);await scare('rabbit');hurt(30,'須知第8條：非整點嘅廣播，唔好理。');if(z==='ferris')R.aq=false;});}}

function updateKiosk(dt){

function renderKiosk(t){

  for(let x=2;x<W;x+=7){const h=6+((x*53)%11);ctx.fillStyle='#3a4438';ctx.fillRect(x,hz-h+4,5,h);}
  ctx.fillStyle='#6b6a58';ctx.fillRect(0,hz,W,cy+20-hz);
  for(let i=0;i<120;i++){ctx.fillStyle=(i%2)?'#5e5d4c':'#77765f';ctx.fillRect((i*97)%W,hz+((i*31)%(cy+20-hz)),2,1);}
  const feet=cy+14;

    drawChar(ctx,'cust',x,feet+bob,{s:2,c,alpha:al});
    if(c.st==='wait'){
      const n=c.order.length,bw=n*12+6,bx=Math.round(x-bw/2),by=Math.max(2,cy-78);
      ctx.fillStyle='#151513';ctx.fillRect(bx-1,by-1,bw+2,16);ctx.fillStyle='#ece6d6';ctx.fillRect(bx,by,bw,14);ctx.fillRect(x-1,by+14,3,2);
      c.order.forEach((it,j)=>drawIcon(ctx,it,bx+4+j*12,by+2));
      const p=c.pat/c.max;ctx.fillStyle='#151513';ctx.fillRect(bx,by+17,bw,3);ctx.fillStyle=p>.5?'#7fa88a':p>.25?'#d4c79c':'#b8302a';ctx.fillRect(bx,by+17,Math.round(bw*p),3);
    }

 3:[['uncle','第三日喇。好少人會返嚟第三次。'],['uncle','如果你聽到有人叫你「家姐」……睇須知。'],['me','你點知我有細妹？'],['sys','阿伯冇答你。']],
 4:[['sys','阿伯今日冇戴眼鏡。佢對眼好紅。'],['uncle','須知……印刷部改咗少少。照跟就得。'],['uncle','記住：紙可以俾人改，但你記得嘅嘢唔會。'],['me','吓？'],['uncle','入去啦。']],
 5:[['uncle','最後一日。'],['uncle','三年前，嗰個著紅雨褸嘅細路女……佢係閉園之前一個鐘，自己行出出口嘅。'],['uncle','我冇攔佢。'],['uncle','今日，我唔會再錯。閉園之前——唔好走。']],

async function brief(){
  PHASE='brief';R=null;P.x=224;P.y=522;P.dir=0;AU.setMode('night');
  await talk(BRIEF[S.night]);openBook('rules',()=>startNight(),'明白，入園');
}

/* ============================================================
   ENDINGS
   ============================================================ */
async function badEnding(){
  R.ending=true;await fadeOut('你行出出口。');await sleep(1200);
  $('fadeTxt').textContent='外面嘅霧一下子散晒。\n好光。好暖。你終於可以返屋企喇。';await sleep(2600);
  showEnding('BAD END','結局：排隊',['第二日，一個遊客喺中央廣場見到一排戴兔頭套嘅人。','排喺最尾嗰個，揹住一個啡色背囊——同你嗰個一模一樣。','佢向個遊客招手：「要排就快啦。」',
    '<small style="color:#6a6252">提示：閉園音樂響咗，但係霧散咗未？</small>'],'#3a1214');
}
async function finalEnding(fainted){
  if(fainted){showEnding('NORMAL END','結局：瞓過咗頭',['你喺遊客中心醒返，窗外嘅霧已經散晒。','阿伯話你係三年來第一個捱得過五日嘅遊客——雖然最後一日你係瞓過去嘅。','你仲係搵唔到小曦。','<small style="color:#6a6252">提示：收集晒小曦嘅 4 張字條，同埋喺第5日搵返佢嘅兔仔髮夾。</small>'],'#2a2e2a');return;}
  const all=['A','B','C','D'].every(k=>S.notes[k]);
  await fadeOut('');await sleep(400);
  $('hud').classList.add('hidden');$('joy').classList.add('hidden');$('actBtn').classList.add('hidden');
  PHASE='endscene';P.x=384;P.y=536;P.dir=0;await fadeIn();AU.setMode('end');
  if(all&&S.badge){
    END_MING=1;
    await talk(['霧散喇。真正咁散。','出口前面，企住一個著紅雨褸嘅細路女。',['sis','……家姐。'],['sis','你冇走早。'],
      ['sis','三年前，我聽到閉園音樂就走。但係出口外面……仲係動物園。'],['sis','我一路寫字條，等有人睇到。'],['me','（你將隻兔仔髮夾扣返喺佢頭髮度。）'],
      ['sis','你仲記得我鍾意兔仔。'],['sis','家姐，我哋返屋企啦。'],'你拖住佢隻手。佢隻手係暖嘅。']);
    for(let i=0;i<10;i++){P.y+=2;await sleep(60);}
    await talk(['你哋一齊行出出口。這一次，外面真係外面。','售票處嘅阿伯除低頂帽，向你哋鞠咗一個好深嘅躬。']);
    showEnding('TRUE END','結局：一齊返屋企',['灰林動物園喺下個月結業。','最後一日，阿伯將《遊客須知》重新印過——原版嘅 9 條。','然後，佢親手加咗第 10 條：','<b style="color:#8e1c1c">「10. 如果你喺霧入面見到走失嘅細路，請拖住佢隻手，帶佢返屋企。」</b>'],'#2a3a30');
  }else{
    await talk(['霧散喇。真正咁散。','阿伯喺出口等你。',['uncle','閉園喇。……你捱過咗五日。'],['uncle','返屋企啦。唔好再嚟。'],'你行出出口，回頭望咗一眼。','兔子館二樓個窗口，有個著紅雨褸嘅細路，向你揮手。']);
    showEnding('NORMAL END','結局：捱過五日',['你平安返到屋企。','但每晚發夢，你都會聽到閉園音樂，同埋一把細細聲嘅「家姐」。',
      '<small style="color:#6a6252">提示：收集晒小曦嘅 4 張字條，同埋喺第5日搵返佢嘅兔仔髮夾。</small>'],'#2a3038');
  }
}
function showEnding(k,title,ps,col){
  PHASE='ending';AU.setMode('end');END_MING=0;
  $('hud').classList.add('hidden');$('joy').classList.add('hidden');$('actBtn').classList.add('hidden');$('kui').classList.add('hidden');$('vign').style.opacity=0;
  $('ecard').innerHTML=`<div class="k">${k}</div><h2>${title}</h2>${ps.map(p=>'<p>'+p+'</p>').join('')}
   <p style="font-size:13px;color:#6a6252;margin-top:14px">字條 ${['A','B','C','D'].filter(x=>S.notes[x]).length}/4 · 兔仔髮夾 ${S.badge?'✔':'✘'} · 暈低 ${S.faints} 次</p>
   <button class="btn" id="eAgain">🎟️ 由第一日重新開始</button>`;
  $('ending').style.background=`radial-gradient(ellipse at center,${col}cc,#000e)`;
  $('ending').classList.remove('hidden');$('fade').classList.remove('on');
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  $('eAgain').onclick=()=>{$('ending').classList.add('hidden');S=freshS();brief();};
}

/* ============================================================
   TITLE & LOOP
   ============================================================ */
function title(){
  PHASE='title';const sv=load();$('title').classList.remove('hidden');
  if(sv&&sv.night>1){$('btnCont').classList.remove('hidden');$('btnCont').textContent='▶ 繼續（第'+sv.night+'日）';}
  $('btnNew').onclick=()=>{AU.init();S=freshS();$('title').classList.add('hidden');brief();};
  $('btnCont').onclick=()=>{AU.init();S=Object.assign(freshS(),sv);$('title').classList.add('hidden');brief();};
}
let last=performance.now(),T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  tickDialogue(dt);AU.update(dt);
  if(PHASE==='patrol'&&R)updatePatrol(dt);
  if(PHASE==='kiosk'&&K)updateKiosk(dt);
  if(PHASE==='kiosk'&&K)renderKiosk(T);
  else if(PHASE==='title')renderTitle(T);
  else{
    let fog=.8;
    if(PHASE==='morning'||PHASE==='ending')fog=.3;else if(PHASE==='endscene')fog=.08;
    else if(R&&R.time>445)fog=.8*clamp((480-R.time)/35,.1,1);
    renderWorld(T,fog,(PHASE==='morning'||PHASE==='ending')?'pan':'follow');
  }
  updateHUD();requestAnimationFrame(loop);
}
buildWorld();title();requestAnimationFrame(loop);
</script>
