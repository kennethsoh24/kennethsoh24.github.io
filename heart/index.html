<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep it below 100°C</title>
<meta name="description" content="Kenneth Soh's digital painting of a kintsugi heart, turned into an interactive 3D object.">
<style>
  :root{
    --bg:#121110; --ink:#efe6d6; --muted:#9b9184; --gold:#f3d77b; --red:#d4121b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}
  .hud{position:fixed;pointer-events:none;z-index:2}
  .title{top:max(20px,env(safe-area-inset-top));left:20px;right:20px}
  .title h1{font-weight:400;font-size:clamp(22px,4vw,34px);letter-spacing:.01em;font-style:italic}
  .title p{margin-top:6px;color:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em}
  .gauge{bottom:max(20px,env(safe-area-inset-bottom));left:20px;font:12px ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:.06em}
  .gauge .temp{font:300 clamp(34px,7vw,52px)/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
  .gauge .temp small{font-size:.45em;color:var(--muted);margin-left:2px}
  .gauge .bar{width:min(220px,48vw);height:3px;background:#ffffff1a;margin:10px 0 6px;border-radius:2px;overflow:hidden}
  .gauge .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .25s}
  .controls{bottom:max(20px,env(safe-area-inset-bottom));right:20px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
  button{font:12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;color:var(--ink);background:#ffffff10;
    border:1px solid #ffffff22;border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px)}
  button:hover{background:#ffffff1e}
  button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);
    font:13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;z-index:2;pointer-events:none;transition:opacity .6s}
  .warn{position:fixed;left:20px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 96px);z-index:3;pointer-events:none;
    font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;color:var(--gold);opacity:0;transition:opacity .4s;text-transform:uppercase}
  a.back{pointer-events:auto;color:var(--muted);text-decoration:none;border-bottom:1px solid #ffffff30}
  @media (max-width:560px){ .controls{max-width:none;left:20px;right:20px;bottom:auto;top:calc(max(20px,env(safe-area-inset-top)) + 84px);justify-content:flex-start} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div class="hud title">
  <h1>“Keep it below 100°C.”</h1>
  <p>kennethsoh24 · Procreate, 2025 · <a class="back" href="../">home</a></p>
</div>

<div class="hud gauge">
  <div class="temp"><span id="temp">36.6</span><small>°C</small></div>
  <div class="bar"><i id="bar"></i></div>
  <div><span id="bpm">62</span> BPM · tap the heart to raise it</div>
</div>

<div class="hud controls">
  <button id="btnSpin" aria-pressed="true">Auto-rotate</button>
  <button id="btnFlat" aria-pressed="false">Flatten to canvas</button>
  <button id="btnCool">Cool down</button>
</div>

<div class="hint" id="hint">loading…</div>
<div class="warn" id="warn">Approaching 100°C</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// clear colour is written straight into the linear buffer, so give it in linear space
renderer.setClearColor(new THREE.Color(0x121110).convertSRGBToLinear());
scene.fog = new THREE.Fog(0x121110, 6, 14);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 0, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 9;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.9;

// ---------- textures + anatomical model ----------
const loader = new THREE.TextureLoader();
const load = (u, srgb) => new Promise((res, rej) => loader.load(u, t => {
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  res(t);
}, undefined, rej));

// heart.bin: [nVerts, nIndices] u32 · positions f32x3 · normals i8x3 · (ao, ventricle, atria, coronary) u8x4 · indices u16
async function loadHeart(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const [nv, ni] = new Uint32Array(buf, 0, 2);
  let o = 8;
  const take = (Type, count, size) => { const a = new Type(buf.slice(o, o + count * size)); o += count * size; return a; };
  const pos = take(Float32Array, nv * 3, 4);
  const nrm = take(Int8Array, nv * 3, 1);
  const att = take(Uint8Array, nv * 4, 1);
  const idx = take(Uint16Array, ni, 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3, true));
  g.setAttribute('region', new THREE.BufferAttribute(att, 4, true));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingSphere();
  return g;
}

const [colorTex, mapsTex, origTex, heartGeo] = await Promise.all([
  load('heart_color.png', true), load('heart_maps.png', false), load('heart_original.jpg', true), loadHeart('heart.bin')
]);

const uniforms = {
  uColor: { value: colorTex }, uMaps: { value: mapsTex },
  uDepth: { value: 0 },          // 0 = pressed flat into the canvas, 1 = full volume
  uVent: { value: 0 },           // ventricular contraction 0..1
  uAtria: { value: 0 },          // atrial contraction 0..1
  uFlow: { value: 0 },           // gold wave travelling out along the cracks
  uHeat: { value: 0 },
  uTime: { value: 0 },
  uLight: { value: new THREE.Vector3(-0.55, 0.65, 0.9).normalize() },
};

const vert = /* glsl */`
  uniform float uDepth, uVent, uAtria, uTime;
  attribute vec4 region;            // ao, ventricle, atria, coronary
  varying vec3 vObj; varying vec3 vObjN; varying vec3 vN; varying vec3 vView; varying vec4 vReg;
  void main(){
    vec3 p = position;
    vec3 n = normal;
    // ventricles squeeze toward their long axis and wring slightly; atria squeeze first
    vec3 vc = vec3(0.02, -0.35, 0.0);
    vec3 dv = p - vc;
    float v = region.y * uVent;
    p -= vec3(dv.x, dv.y * 0.35, dv.z) * 0.07 * v;
    float tw = 0.08 * v * (vc.y - p.y);
    p.xz = mat2(cos(tw), -sin(tw), sin(tw), cos(tw)) * p.xz;
    vec3 ac = vec3(0.0, 0.2, -0.1);
    p -= (p - ac) * 0.05 * region.z * uAtria;
    // great vessels swell as blood is pushed out
    float vessel = 1.0 - clamp(region.y + region.z, 0.0, 1.0);
    p += n * 0.012 * vessel * uVent;
    vObj = p; vObjN = n; vReg = region;
    p.z *= mix(0.03, 1.0, uDepth);
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    vView = -mv.xyz;
    vN = normalize(normalMatrix * n);
    gl_Position = projectionMatrix * mv;
  }`;

const frag = /* glsl */`
  uniform sampler2D uColor, uMaps; uniform float uVent, uFlow, uHeat, uTime, uDepth;
  uniform vec3 uLight;
  varying vec3 vObj; varying vec3 vObjN; varying vec3 vN; varying vec3 vView; varying vec4 vReg;

  float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noise(vec3 x){
    vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }

  void main(){
    vec3 N = normalize(vN);
    vec3 V = normalize(vView);
    vec3 L = normalize((viewMatrix * vec4(uLight, 0.)).xyz);
    float ao = vReg.x, cor = vReg.w;

    // your painting, projected straight through the model from the front
    vec2 uv = vObj.xy / 3.0 + 0.5;
    vec4 paint = texture2D(uColor, uv);
    vec4 maps = texture2D(uMaps, uv);
    float facing = abs(normalize(vObjN).z);

    // brushy painted flesh for everywhere the projection can't reach (sides, back, vessel tops)
    vec3 q = vObj * vec3(3.0, 7.5, 3.0);                       // stretched noise = vertical brush strokes
    float b = fbm(q + vec3(0.0, uTime * 0.02, 0.0));
    float b2 = fbm(vObj * 14.0);
    vec3 deep = vec3(0.30, 0.012, 0.018), mid = vec3(0.62, 0.03, 0.04), hot = vec3(0.92, 0.10, 0.08);
    vec3 flesh = mix(deep, mid, smoothstep(0.30, 0.62, b));
    flesh = mix(flesh, hot, smoothstep(0.58, 0.78, b) * 0.8);
    flesh = mix(flesh, vec3(0.04, 0.005, 0.008), smoothstep(0.55, 0.30, b2) * 0.45);   // dark charcoal smudges
    // coronary vessels: darker, bluish-purple, with a little yellow fat alongside
    flesh = mix(flesh, vec3(0.30, 0.03, 0.10), cor * 0.8);
    flesh = mix(flesh, vec3(0.75, 0.55, 0.30), smoothstep(0.0, 0.5, cor) * (1.0 - cor) * 0.25);

    float useP = paint.a * smoothstep(0.15, 0.75, facing) * (1.0 - vReg.w * 0.6);
    // the back gets a darker, mirrored echo of the painting
    float back = step(vObjN.z, 0.0);
    vec3 paintCol = mix(paint.rgb, paint.rgb * vec3(0.75, 0.6, 0.6), back);
    vec3 base = mix(flesh, paintCol, useP * mix(0.92, 0.6, back));

    // white chalky speckle, like the dry brush in the original
    float speck = step(0.83, fbm(vObj * 42.0)) * step(0.45, b) * 0.55;
    base = mix(base, vec3(0.95, 0.9, 0.88), speck * (1.0 - useP * 0.7));

    // light: soft wrap diffuse with a red sub-surface bleed, wet double specular, red rim
    float ndl = dot(N, L);
    float diff = max(ndl, 0.0);
    float wrap = max((ndl + 0.5) / 1.5, 0.0);
    vec3 H = normalize(L + V);
    float sp1 = pow(max(dot(N, H), 0.0), 90.0);
    float sp2 = pow(max(dot(N, H), 0.0), 16.0) * 0.05;
    float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    vec3 col = base * (0.14 + 0.8 * diff) * ao + base * vec3(0.55, 0.05, 0.04) * wrap * 0.35;
    col += (sp1 * 0.7 + sp2) * vec3(1.0, 0.8, 0.78) * (0.4 + 0.6 * ao) * mix(0.7, 1.0, b);
    col += rim * vec3(0.85, 0.06, 0.05) * (0.25 + 0.35 * uVent + 0.45 * uHeat) * ao;
    col *= 1.0 + uVent * 0.15 * vec3(1.0, 0.3, 0.3);

    // kintsugi gold, projected from the painting through front and back
    float g = maps.g * smoothstep(0.35, 0.7, facing);
    float along = 1.0 - maps.a;
    float wave = smoothstep(0.12, 0.0, abs(along - (1.0 - uFlow)));
    float shimmer = 0.85 + 0.15 * sin(uTime * 3.0 + vObj.y * 30.0);
    vec3 goldC = vec3(1.0, 0.76, 0.34);
    col = mix(col, goldC * (0.55 + 2.0 * sp2 * 6.0 + 0.5 * diff), g * 0.9);
    col += g * goldC * (0.3 * shimmer + 1.6 * wave * (0.6 + 0.4 * uHeat) + 0.6 * uHeat + 0.3 * uVent);

    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const heartMat = new THREE.ShaderMaterial({ uniforms, vertexShader: vert, fragmentShader: frag });
const heartMesh = new THREE.Mesh(heartGeo, heartMat);
const heart = new THREE.Group();
heart.add(heartMesh);
scene.add(heart);

// ---------- the canvas it lifts off ----------
const canvasMat = new THREE.MeshBasicMaterial({ map: origTex, transparent: true, opacity: 1, fog: false, depthWrite: false });
const canvasPlane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), canvasMat);
canvasPlane.position.z = 0.06;
canvasPlane.renderOrder = 2;
scene.add(canvasPlane);

// ---------- embers + dust ----------
const N = reduced ? 160 : 520;
const pPos = new Float32Array(N * 3), pSeed = new Float32Array(N), pKind = new Float32Array(N);
for (let i = 0; i < N; i++) {
  pPos[i*3] = (Math.random() - .5) * 5; pPos[i*3+1] = (Math.random() - .5) * 5; pPos[i*3+2] = (Math.random() - .5) * 3;
  pSeed[i] = Math.random(); pKind[i] = Math.random() < 0.35 ? 1 : 0;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('seed', new THREE.BufferAttribute(pSeed, 1));
pGeo.setAttribute('kind', new THREE.BufferAttribute(pKind, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uHeat: uniforms.uHeat, uPix: { value: renderer.getPixelRatio() } },
  vertexShader: `
    uniform float uTime, uHeat, uPix; attribute float seed, kind; varying float vA; varying float vK;
    void main(){
      vec3 p = position;
      float sp = mix(0.08, 0.35, seed) * (1.0 + 2.5*uHeat);
      p.y = mod(p.y + 2.5 + uTime*sp, 5.0) - 2.5;
      p.x += sin(uTime*0.6 + seed*30.0)*0.15;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      vA = smoothstep(2.5, 1.2, abs(p.y)) * (0.35 + 0.65*uHeat*kind + 0.3*(1.0-kind));
      vK = kind;
      gl_PointSize = uPix * mix(2.0, 5.0, seed) * (kind > 0.5 ? 1.4 + uHeat : 1.0) * (6.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA; varying float vK;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d) * vA;
      vec3 c = vK > 0.5 ? vec3(1.0, 0.45, 0.12) : vec3(0.9, 0.88, 0.82);
      gl_FragColor = vec4(c, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(pGeo, pMat);
scene.add(embers);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- heartbeat + temperature ----------
let bpm = 62, phase = 0, lastBeat = 0, flat = false;
const restBpm = 62;
const $ = id => document.getElementById(id);
const tempEl = $('temp'), barEl = $('bar'), bpmEl = $('bpm'), warn = $('warn');
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(heartMesh)[0]) { bpm = Math.min(bpm + 14, 178); phase = 0; }  // a tap jolts the heart
});

$('btnSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.setAttribute('aria-pressed', controls.autoRotate); };
$('btnFlat').onclick = e => { flat = !flat; e.target.setAttribute('aria-pressed', flat);
  if (flat) { controls.autoRotate = false; $('btnSpin').setAttribute('aria-pressed', false); } };
$('btnCool').onclick = () => { bpm = restBpm; };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  fit();
});
function fit(){ // keep the whole heart in frame on narrow phones
  const need = innerWidth / innerHeight < 0.8 ? 6.2 / (innerWidth / innerHeight / 0.8) : 6.2;
  controls.maxDistance = Math.max(9, need + 1);
  if (camera.position.length() < need) camera.position.setLength(need);
}
fit();

$('hint').textContent = 'drag to turn · tap to quicken';
setTimeout(() => $('hint').style.opacity = 0, 2600);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  uniforms.uTime.value = t;

  // intro: the painting rests on its canvas, then the heart swells out of it
  const intro = Math.min(t / 3.2, 1);
  const lift = THREE.MathUtils.smootherstep(intro, 0.2, 1);
  const target = flat ? 0 : 1;
  const dCur = uniforms.uDepth.value;
  uniforms.uDepth.value = intro < 1 ? lift * target : dCur + (target - dCur) * Math.min(dt * 3, 1);
  const vol = uniforms.uDepth.value;
  canvasMat.opacity = 1 - THREE.MathUtils.smoothstep(vol, 0.0, 0.55);
  canvasPlane.visible = canvasMat.opacity > 0.01;
  if (flat) camera.position.lerp(new THREE.Vector3(0, 0, camera.position.length()), Math.min(dt * 2.5, 1));

  // heart rate relaxes back toward rest; temperature follows
  bpm += (restBpm - bpm) * dt * 0.06;
  const cycle = 60 / bpm;
  phase += dt / cycle;
  if (phase >= 1) { phase -= 1; lastBeat = t; }
  const k = reduced ? 0.35 : 1;
  // atria contract just before the ventricles (lub), then the ventricles squeeze and relax (dub)
  uniforms.uAtria.value = k * pulse(phase, 0.04, 0.05) * vol;
  const vent = k * (pulse(phase, 0.2, 0.07) + 0.45 * pulse(phase, 0.36, 0.05));
  uniforms.uVent.value = vent * vol;
  uniforms.uFlow.value = Math.min((t - lastBeat) / (cycle * 0.9), 1);
  const temp = 36.6 + (bpm - restBpm) / (178 - restBpm) * (99.4 - 36.6);
  const heat = (temp - 36.6) / (100 - 36.6);
  uniforms.uHeat.value = heat;
  const s = 1 + 0.02 * vent * vol;
  heart.scale.setScalar(s);
  bloom.strength = 0.4 + 0.35 * heat + 0.15 * vent;

  tempEl.textContent = temp.toFixed(1);
  tempEl.parentElement.style.color = heat > 0.75 ? 'var(--gold)' : '';
  barEl.style.width = temp.toFixed(1) + '%';
  bpmEl.textContent = Math.round(bpm);
  warn.style.opacity = temp > 90 ? (0.6 + 0.4 * Math.sin(t * 8)) : 0;

  embers.rotation.y = t * 0.03;
  controls.update();
  composer.render();
});
</script>
</body>
</html>
