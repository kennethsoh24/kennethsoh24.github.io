<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep it below 100°C</title>
<meta name="description" content="Kenneth Soh's digital painting of a kintsugi heart, turned into an interactive 3D object.">
<style>
  :root{
    --bg:#121110; --ink:#efe6d6; --muted:#9b9184; --gold:#f3d77b; --red:#d4121b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}
  .hud{position:fixed;pointer-events:none;z-index:2}
  .title{top:max(20px,env(safe-area-inset-top));left:20px;right:20px}
  .title h1{font-weight:400;font-size:clamp(22px,4vw,34px);letter-spacing:.01em;font-style:italic}
  .title p{margin-top:6px;color:var(--muted);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em}
  .gauge{bottom:max(20px,env(safe-area-inset-bottom));left:20px;font:12px ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:.06em}
  .gauge .temp{font:300 clamp(34px,7vw,52px)/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
  .gauge .temp small{font-size:.45em;color:var(--muted);margin-left:2px}
  .gauge .bar{width:min(220px,48vw);height:3px;background:#ffffff1a;margin:10px 0 6px;border-radius:2px;overflow:hidden}
  .gauge .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .25s}
  .controls{bottom:max(20px,env(safe-area-inset-bottom));right:20px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
  button{font:12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;color:var(--ink);background:#ffffff10;
    border:1px solid #ffffff22;border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px)}
  button:hover{background:#ffffff1e}
  button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);
    font:13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;z-index:2;pointer-events:none;transition:opacity .6s}
  .warn{position:fixed;left:20px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 96px);z-index:3;pointer-events:none;
    font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;color:var(--gold);opacity:0;transition:opacity .4s;text-transform:uppercase}
  a.back{pointer-events:auto;color:var(--muted);text-decoration:none;border-bottom:1px solid #ffffff30}
  @media (max-width:560px){ .controls{max-width:none;left:20px;right:20px;bottom:auto;top:calc(max(20px,env(safe-area-inset-top)) + 84px);justify-content:flex-start} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div class="hud title">
  <h1>“Keep it below 100°C.”</h1>
  <p>kennethsoh24 · Procreate, 2025 · <a class="back" href="../">home</a></p>
</div>

<div class="hud gauge">
  <div class="temp"><span id="temp">36.6</span><small>°C</small></div>
  <div class="bar"><i id="bar"></i></div>
  <div><span id="bpm">62</span> BPM · tap the heart to raise it</div>
</div>

<div class="hud controls">
  <button id="btnSpin" aria-pressed="true">Auto-rotate</button>
  <button id="btnFlat" aria-pressed="false">Flatten to canvas</button>
  <button id="btnCool">Cool down</button>
</div>

<div class="hint" id="hint">loading…</div>
<div class="warn" id="warn">Approaching 100°C</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// clear colour is written straight into the linear buffer, so give it in linear space
renderer.setClearColor(new THREE.Color(0x121110).convertSRGBToLinear());
scene.fog = new THREE.Fog(0x121110, 6, 14);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 0, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 9;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.9;

// ---------- textures ----------
const loader = new THREE.TextureLoader();
const load = (u, srgb) => new Promise(r => loader.load(u, t => {
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  r(t);
}));
const [colorTex, mapsTex, origTex] = await Promise.all([
  load('heart_color.png', true), load('heart_maps.png', false), load('heart_original.jpg', true)
]);
mapsTex.premultiplyAlpha = false;

// ---------- the heart: two relief shells (front + back) driven by a depth map ----------
const uniforms = {
  uColor: { value: colorTex }, uMaps: { value: mapsTex },
  uDepth: { value: 0 },          // 0 = flat painting, 1 = full volume
  uThick: { value: 0.62 },
  uBeat: { value: 0 },           // 0..1 pulse
  uFlow: { value: 0 },           // gold flowing out from the centre crack
  uHeat: { value: 0 },           // 0..1 temperature
  uTime: { value: 0 },
  uLight: { value: new THREE.Vector3(-0.5, 0.7, 1).normalize() },
};

const vert = /* glsl */`
  uniform sampler2D uMaps; uniform float uDepth, uThick, uBeat, uSide;
  varying vec2 vUv; varying vec3 vN; varying vec3 vView; varying float vD;
  float h(vec2 uv){ return texture2D(uMaps, uv).r; }
  void main(){
    vUv = uv;
    float d = h(uv);
    float amp = uThick * uDepth * (1.0 + 0.10 * uBeat);
    vec3 p = position; p.z = d * amp * uSide;
    float e = 1.0/256.0;
    float dx = (h(uv+vec2(e,0.)) - h(uv-vec2(e,0.))) * amp;
    float dy = (h(uv+vec2(0.,e)) - h(uv-vec2(0.,e))) * amp;
    vec3 n = normalize(vec3(-dx/(2.0*e*3.0), -dy/(2.0*e*3.0), uSide));
    vD = d;
    vec4 mv = modelViewMatrix * vec4(p,1.0);
    vView = -mv.xyz;
    vN = normalize(normalMatrix * n);
    gl_Position = projectionMatrix * mv;
  }`;

const frag = /* glsl */`
  uniform sampler2D uColor, uMaps; uniform float uBeat, uFlow, uHeat, uTime, uSide, uDepth;
  uniform vec3 uLight;
  varying vec2 vUv; varying vec3 vN; varying vec3 vView; varying float vD;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*45758.5); }
  void main(){
    vec4 c = texture2D(uColor, vUv);
    vec4 m = texture2D(uMaps, vUv);
    if (m.b < 0.5) discard;
    vec3 N = normalize(vN);
    vec3 V = normalize(vView);
    vec3 L = normalize((viewMatrix * vec4(uLight,0.)).xyz);
    float diff = max(dot(N,L),0.0);
    float rim = pow(1.0 - max(dot(N,V),0.0), 2.5);
    vec3 base = c.rgb;
    if (uSide < 0.0) base = mix(base, vec3(dot(base, vec3(.5,.3,.2)))*vec3(1.,.25,.22), 0.35) * 0.62;
    // wet, glossy flesh
    vec3 H = normalize(L+V);
    float spec = pow(max(dot(N,H),0.0), 48.0) * (0.25 + 0.6*smoothstep(0.5,0.95,c.r+c.g));
    vec3 col = base * (0.42 + 0.78*diff) + spec*vec3(1.0,0.85,0.8);
    col += rim * vec3(0.9,0.08,0.06) * (0.3 + 0.4*uBeat + 0.4*uHeat) * uDepth;
    // flush redder with heat
    col *= 1.0 + uBeat*0.18*vec3(1.0,0.35,0.3);
    // kintsugi: gold glows, and a bright wave runs outward from the centre on each beat
    float g = m.g;
    float along = 1.0 - m.a;                     // 1 at the central junction -> 0 at tips
    float wave = smoothstep(0.12, 0.0, abs(along - (1.0 - uFlow)));
    float shimmer = 0.85 + 0.15*sin(uTime*3.0 + vUv.y*40.0);
    vec3 goldC = vec3(1.0,0.78,0.36);
    col = mix(col, goldC*(0.9+0.6*pow(max(dot(N,H),0.),12.)), g*0.85);
    col += g * goldC * (0.3*shimmer + 1.6*wave*(0.6+0.4*uHeat) + 0.6*uHeat + 0.3*uBeat);
    // white speckle sparkle
    float lum = dot(c.rgb, vec3(0.333));
    float sp = step(0.62, lum) * step(0.985, hash(floor(vUv*512.0) + floor(uTime*6.0)));
    col += sp * vec3(1.0) * 0.8;
    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const heart = new THREE.Group();
scene.add(heart);
const geo = new THREE.PlaneGeometry(3, 3, 320, 320);
const mkShell = side => new THREE.Mesh(geo, new THREE.ShaderMaterial({
  uniforms: { ...uniforms, uSide: { value: side } },
  vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide,
}));
heart.add(mkShell(1), mkShell(-1));

// ---------- the canvas it lifts off ----------
const canvasMat = new THREE.MeshBasicMaterial({ map: origTex, transparent: true, opacity: 1, fog: false });
const canvasPlane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), canvasMat);
canvasPlane.position.z = -0.002;
scene.add(canvasPlane);

// ---------- embers + dust ----------
const N = reduced ? 160 : 520;
const pPos = new Float32Array(N * 3), pSeed = new Float32Array(N), pKind = new Float32Array(N);
for (let i = 0; i < N; i++) {
  pPos[i*3] = (Math.random() - .5) * 5; pPos[i*3+1] = (Math.random() - .5) * 5; pPos[i*3+2] = (Math.random() - .5) * 3;
  pSeed[i] = Math.random(); pKind[i] = Math.random() < 0.35 ? 1 : 0;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('seed', new THREE.BufferAttribute(pSeed, 1));
pGeo.setAttribute('kind', new THREE.BufferAttribute(pKind, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uHeat: uniforms.uHeat, uPix: { value: renderer.getPixelRatio() } },
  vertexShader: `
    uniform float uTime, uHeat, uPix; attribute float seed, kind; varying float vA; varying float vK;
    void main(){
      vec3 p = position;
      float sp = mix(0.08, 0.35, seed) * (1.0 + 2.5*uHeat);
      p.y = mod(p.y + 2.5 + uTime*sp, 5.0) - 2.5;
      p.x += sin(uTime*0.6 + seed*30.0)*0.15;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      vA = smoothstep(2.5, 1.2, abs(p.y)) * (0.35 + 0.65*uHeat*kind + 0.3*(1.0-kind));
      vK = kind;
      gl_PointSize = uPix * mix(2.0, 5.0, seed) * (kind > 0.5 ? 1.4 + uHeat : 1.0) * (6.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA; varying float vK;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d) * vA;
      vec3 c = vK > 0.5 ? vec3(1.0, 0.45, 0.12) : vec3(0.9, 0.88, 0.82);
      gl_FragColor = vec4(c, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const embers = new THREE.Points(pGeo, pMat);
scene.add(embers);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- heartbeat + temperature ----------
let bpm = 62, phase = 0, lastBeat = 0, flat = false, depthTarget = 1;
const restBpm = 62;
const $ = id => document.getElementById(id);
const tempEl = $('temp'), barEl = $('bar'), bpmEl = $('bpm'), warn = $('warn');

// lub-dub: two gaussian pulses inside one cycle
const lubdub = t => Math.exp(-Math.pow((t - 0.08) / 0.045, 2)) + 0.6 * Math.exp(-Math.pow((t - 0.30) / 0.05, 2));

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(heart.children)[0];
  if (hit) { bpm = Math.min(bpm + 14, 178); phase = 0; }  // a tap jolts the heart
});

$('btnSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.setAttribute('aria-pressed', controls.autoRotate); };
$('btnFlat').onclick = e => { flat = !flat; e.target.setAttribute('aria-pressed', flat);
  if (flat) { controls.autoRotate = false; $('btnSpin').setAttribute('aria-pressed', false); } };
$('btnCool').onclick = () => { bpm = restBpm; };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  fit();
});
function fit(){ // keep the whole heart in frame on narrow phones
  const need = innerWidth / innerHeight < 0.8 ? 6.2 / (innerWidth / innerHeight / 0.8) : 6.2;
  controls.maxDistance = Math.max(9, need + 1);
  if (camera.position.length() < need) camera.position.setLength(need);
}
fit();

$('hint').textContent = 'drag to turn · tap to quicken';
setTimeout(() => $('hint').style.opacity = 0, 2600);

const clock = new THREE.Clock();
let intro = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  uniforms.uTime.value = t;

  // intro: the painting rests flat on its canvas, then lifts off and swells into volume
  intro = Math.min(t / 3.2, 1);
  const lift = intro < 0.25 ? 0 : THREE.MathUtils.smootherstep(intro, 0.25, 1);
  depthTarget = flat ? 0 : 1;
  const dCur = uniforms.uDepth.value;
  uniforms.uDepth.value = intro < 1 ? lift * depthTarget : dCur + (depthTarget - dCur) * Math.min(dt * 3, 1);
  const vol = uniforms.uDepth.value;
  canvasMat.opacity = 1 - vol;
  canvasPlane.visible = canvasMat.opacity > 0.01;
  heart.position.z = vol * 0.25;
  if (flat) { // ease the camera back to face the canvas
    camera.position.lerp(new THREE.Vector3(0, 0, camera.position.length()), Math.min(dt * 2.5, 1));
  }

  // heart rate relaxes back toward rest; temperature follows
  bpm += (restBpm - bpm) * dt * 0.06;
  const cycle = 60 / bpm;
  phase += dt / cycle;
  if (phase >= 1) { phase -= 1; lastBeat = t; }
  const beat = reduced ? 0.3 * lubdub(phase) : lubdub(phase);
  uniforms.uBeat.value = beat * vol;
  uniforms.uFlow.value = Math.min((t - lastBeat) / (cycle * 0.9), 1);
  const temp = 36.6 + (bpm - restBpm) / (178 - restBpm) * (99.4 - 36.6);
  const heat = (temp - 36.6) / (100 - 36.6);
  uniforms.uHeat.value = heat;
  const s = 1 + 0.045 * beat * vol;
  heart.scale.set(s, s * (1 + 0.01 * beat), s);
  bloom.strength = 0.4 + 0.35 * heat + 0.15 * beat;

  tempEl.textContent = temp.toFixed(1);
  tempEl.parentElement.style.color = heat > 0.75 ? 'var(--gold)' : '';
  barEl.style.width = (temp / 100 * 100).toFixed(1) + '%';
  bpmEl.textContent = Math.round(bpm);
  warn.style.opacity = temp > 90 ? (0.6 + 0.4 * Math.sin(t * 8)) : 0;

  embers.rotation.y = t * 0.03;
  controls.update();
  composer.render();
});
</script>
</body>
</html>
