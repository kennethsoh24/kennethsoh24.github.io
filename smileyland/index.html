<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>笑笑樂園 · 夜班守則</title>
<meta name="description" content="一個主題公園規則怪談像素RPG：夜班巡園、執遺失物、三點開小食亭招呼特別客人——記住，守則唔一定全部係真嘅。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1420; --cream:#fff6e0; --paper:#f6ecd2; --yellow:#ffcf3f; --orange:#f08a24;
  --red:#e2453c; --cyan:#3fd0e0; --green:#5fd068; --purple:#7a5cff; --night:#0b0a14;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hidden{display:none!important}
.pix{font-family:'Press Start 2P',monospace}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink)}
.btn{font:inherit;font-weight:900;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;
  box-shadow:0 4px 0 var(--ink);padding:10px 18px;cursor:pointer;font-size:16px;color:var(--ink);transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:var(--cream)}
.btn.red{background:var(--red);color:#fff}
.btn.cyan{background:var(--cyan)}
.btn:disabled{filter:grayscale(1) brightness(.8);cursor:not-allowed}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hudL{position:absolute;left:12px;top:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:150px}
#clockRow{display:flex;align-items:baseline;gap:10px}
#clock{font-size:16px;color:var(--ink)}
#clock.glitch{color:var(--red);animation:jit .15s steps(2) infinite}
#nightLbl{font-size:12px;font-weight:900;background:var(--ink);color:var(--yellow);border-radius:6px;padding:1px 7px}
#sanRow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
#sanBar{flex:1;height:12px;border:2px solid var(--ink);border-radius:6px;background:#3a2f45;overflow:hidden}
#sanFill{display:block;height:100%;width:100%;background:var(--cyan);transition:width .2s}
#sanFill.mid{background:var(--yellow)} #sanFill.low{background:var(--red);animation:pulse .6s infinite}
#hudR{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#coinBox{padding:6px 12px;font-weight:900;font-size:15px}
#charmBox{padding:6px 10px;font-weight:900;font-size:13px}
#zoneTag{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:900;font-size:14px;color:#fff;
  text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s;letter-spacing:.15em}
#zoneTag.show{opacity:1}
#hint{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);padding:6px 14px;font-weight:900;font-size:14px;z-index:6;pointer-events:none;white-space:nowrap}
#hint kbd{font-family:'Press Start 2P',monospace;font-size:10px;background:var(--yellow);border:2px solid var(--ink);border-radius:5px;padding:2px 5px;margin-right:6px}
#toasts{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none;width:min(92vw,520px)}
.toast{padding:7px 14px;font-weight:900;font-size:14px;animation:tin .25s ease-out;text-align:center;line-height:1.5}
.toast.good{background:#e6ffe0} .toast.bad{background:#ffe0dc;color:#8a1a14} .toast.gold{background:var(--yellow)}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .4s}
#cast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:9;width:min(92vw,560px);padding:10px 14px 10px 12px;
  background:#1b2440;color:#d8f4ff;border:3px solid #000;border-radius:10px;box-shadow:0 5px 0 #000;font-weight:700;font-size:15px;line-height:1.6;pointer-events:none}
#cast b{color:var(--cyan);margin-right:6px}
#cast.fake{background:#2a0f16;color:#ffd0d0;animation:jit .2s steps(2) infinite}
#cast.fake b{color:var(--red)}
@keyframes jit{0%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 1px),-1px)}100%{transform:translate(calc(-50% - 1px),1px)}}
#clock.glitch{animation:jit2 .15s steps(2) infinite}
@keyframes jit2{50%{transform:translate(1px,-1px)}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@keyframes pulse{50%{filter:brightness(1.6)}}

/* Mobile controls */
#joy{position:fixed;left:0;bottom:0;width:50%;height:55%;z-index:4;touch-action:none}
#joyBase{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);transform:translate(-50%,-50%);display:none}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,207,63,.8);border:3px solid var(--ink);left:50%;top:50%;transform:translate(-50%,-50%)}
#actBtn{position:fixed;right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;z-index:6;font-size:20px;padding:0}

/* Dialogue */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom))}
.dbox{width:min(760px,100%);display:flex;gap:12px;padding:12px;position:relative;cursor:pointer;min-height:130px}
#portWrap{flex:0 0 auto;width:104px;height:104px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(#5a6fb0,#2b3566);overflow:hidden}
#portWrap.none{display:none}
#portrait{width:100%;height:100%;image-rendering:pixelated}
.dright{flex:1;min-width:0;display:flex;flex-direction:column}
#dname{align-self:flex-start;background:var(--yellow);border:3px solid var(--ink);border-radius:8px;padding:1px 10px;font-weight:900;font-size:14px;margin:-26px 0 6px;box-shadow:0 3px 0 var(--ink)}
#dname:empty{display:none}
#dtext{font-size:17px;font-weight:700;line-height:1.65;min-height:3.3em;white-space:pre-wrap}
#dtext.sys{color:#4a3d55;font-style:italic}
#dchoices{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#dchoices .btn{text-align:left;font-size:15px;padding:8px 12px}
#dchoices .btn span{font-family:'Press Start 2P';font-size:9px;margin-right:8px;opacity:.6}
#dnext{position:absolute;right:14px;bottom:8px;font-size:12px;animation:pulse 1s infinite}

/* Book */
.modal{position:fixed;inset:0;z-index:30;background:rgba(6,4,12,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.paper{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:0 6px 0 var(--ink),inset 0 0 40px rgba(120,90,40,.25);
  width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;position:relative}
.tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tab{font:inherit;font-weight:900;font-size:13px;padding:6px 12px;border:3px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#d9cba6;cursor:pointer;color:var(--ink)}
.tab.on{background:#fffaf0}
#bookBody{background:#fffaf0;border-top:3px solid var(--ink);padding:16px 18px;overflow:auto;flex:1;min-height:0}
#bookFoot{padding:10px 12px;display:flex;justify-content:flex-end;gap:8px;border-top:3px dashed rgba(0,0,0,.15)}
.rh{text-align:center;margin-bottom:12px}
.rh h2{margin:0;font-size:20px;font-weight:900;letter-spacing:.12em}
.rh small{display:block;font-size:12px;color:#6b5b4b;margin-top:3px}
.rule{display:flex;gap:10px;padding:8px 2px;border-bottom:1px dashed #cdbf9f;font-size:15px;line-height:1.65;font-weight:700}
.rule b{flex:0 0 26px;font-family:'Press Start 2P';font-size:11px;padding-top:4px}
.rule.alt{color:#5b2323;letter-spacing:.04em}
.rule .new{display:inline-block;font-size:10px;font-weight:900;background:var(--red);color:#fff;border-radius:4px;padding:0 5px;margin-left:6px;transform:rotate(-4deg);vertical-align:2px}
.stampbox{margin-top:12px;text-align:right;font-size:12px;color:#7a6a58}
.stampbox i{display:inline-block;border:2px solid #c0392b;color:#c0392b;padding:2px 8px;transform:rotate(-6deg);font-style:normal;font-weight:900;border-radius:4px}
.note{background:#fff;border:2px solid #d4c7a8;padding:12px 14px;margin-bottom:12px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.1);
  background-image:repeating-linear-gradient(#fff 0 25px,#cfe3f4 25px 26px)}
.note p{margin:0;font-size:16px;line-height:26px;color:#b3261e;font-weight:700}
.note.fake{transform:rotate(1deg)} .note.fake p{color:#3b1d3d;font-style:italic;letter-spacing:.08em}
.note .sig{text-align:right;color:#b3261e;font-weight:900}
.note .when{font-size:11px;color:#998;font-weight:700;margin-bottom:4px}
.empty{color:#8a7a68;text-align:center;padding:28px 0;font-weight:700}
#noteModal .paper{width:min(460px,100%)}

/* Kiosk UI */
#kui{position:fixed;inset:0;z-index:10;pointer-events:none}
#kTop{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#kTop .panel{padding:6px 12px;font-weight:900;font-size:14px;white-space:nowrap}
#kTime{font-family:'Press Start 2P';font-size:12px}
#kBot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
#kTray{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:900;font-size:13px}
#kTraySlots{display:flex;gap:4px}
.tslot{width:38px;height:38px;border:2px dashed #9b8a77;border-radius:8px;display:grid;place-items:center;background:#fff}
.tslot canvas{width:30px;height:30px;image-rendering:pixelated}
#kBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ibtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:6px 8px 8px;overflow:hidden}
.ibtn canvas{width:36px;height:36px;image-rendering:pixelated}
.ibtn small{font-size:12px}
.ibtn i{position:absolute;left:0;bottom:0;height:5px;background:var(--orange);width:0}
#kFree.on{background:#b9f3c0}
#kHelp{font-size:12px;color:#fff;text-shadow:0 1px 0 #000;font-weight:700;text-align:center}

/* screens */
.screen{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#title{flex-direction:column;gap:16px;text-align:center;background:radial-gradient(ellipse at center,rgba(10,6,20,.15),rgba(10,6,20,.75))}
.logo{font-weight:900;font-size:clamp(40px,10vw,76px);color:var(--yellow);line-height:1.05;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(255,90,60,.4);letter-spacing:.05em}
.logo small{display:block;font-size:.42em;color:#fff;margin-top:8px;letter-spacing:.3em}
.sub{font-family:'Press Start 2P';font-size:10px;color:#ffd7a0;letter-spacing:.15em;text-shadow:0 2px 0 #000}
.titleBtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px}
.titleBtns .btn{min-width:220px;font-size:18px}
.keys{color:#ddd;font-size:12px;font-weight:700;text-shadow:0 1px 0 #000;line-height:1.8}
#morning{background:linear-gradient(rgba(255,190,140,.15),rgba(40,20,40,.35))}
.mcard{width:min(720px,100%);padding:16px 16px 14px;max-height:100%;overflow:auto}
.mcard h2{margin:0 0 4px;font-size:24px;font-weight:900}
.mcard .k{font-family:'Press Start 2P';font-size:9px;color:#8a6a4a;letter-spacing:.2em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-weight:900}
.stat small{display:block;font-size:11px;color:#7a6a58}
.stat b{font-size:20px}
.mtalk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.mtalk canvas{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(#ffd59a,#ff9a7a);flex:0 0 auto}
.bubble{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.6;position:relative}
.bubble b{display:block;font-size:12px;color:#a0522d}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px}
.item .ic{font-size:26px;width:36px;text-align:center}
.item .tx{flex:1;min-width:0;font-size:12px;font-weight:700;color:#5b4b3b;line-height:1.4}
.item .tx b{display:block;font-size:14px;color:var(--ink)}
.item .btn{padding:6px 10px;font-size:13px;white-space:nowrap}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#ending{background:rgba(0,0,0,.6);flex-direction:column}
.ecard{width:min(620px,100%);padding:20px;text-align:center}
.ecard .k{font-family:'Press Start 2P';font-size:10px;letter-spacing:.2em;color:#8a6a4a}
.ecard h2{font-size:30px;margin:8px 0 12px;font-weight:900}
.ecard p{font-size:16px;line-height:1.85;font-weight:700;margin:0 0 10px}
#fade{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1;pointer-events:auto}
#fadeTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;text-align:center;padding:20px;line-height:1.8}
#scare{position:fixed;inset:0;width:100%;height:100%;z-index:45;image-rendering:pixelated;pointer-events:none;background:#000}
.shake{animation:shk .08s infinite}
@keyframes shk{0%{transform:translate(4px,-3px)}50%{transform:translate(-5px,4px)}100%{transform:translate(3px,5px)}}
#vign{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,20,.55) 100%)}
@media (max-width:560px){
  #hudL{min-width:128px;padding:6px 9px} #clock{font-size:13px}
  #dtext{font-size:15px} #portWrap{width:76px;height:76px} .dbox{min-height:110px}
  .ibtn{min-width:64px} #hint{bottom:30%}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vign"></div>

<div id="hud" class="hidden">
  <div id="hudL" class="panel">
    <div id="clockRow"><span id="clock" class="pix">22:00</span><span id="nightLbl">第1晚</span></div>
    <div id="sanRow">理智<div id="sanBar"><i id="sanFill"></i></div></div>
  </div>
  <div id="zoneTag"></div>
  <div id="hudR">
    <div id="charmBox" class="panel hidden">🧧 <b id="charmTxt">0</b></div>
    <div id="coinBox" class="panel">💰 <b id="coinTxt">0</b></div>
    <button id="bookBtn" class="btn sm">📜 守則</button>
    <button id="muteBtn" class="btn sm ghost">🔊</button>
  </div>
</div>
<div id="toasts"></div>
<div id="cast" class="hidden"></div>
<div id="hint" class="panel hidden"></div>
<div id="joy" class="hidden"><div id="joyBase"><div id="joyKnob"></div></div></div>
<button id="actBtn" class="btn hidden">E</button>

<div id="dlg" class="hidden">
  <div class="dbox panel" id="dbox">
    <div id="portWrap"><canvas id="portrait" width="44" height="44"></canvas></div>
    <div class="dright">
      <div id="dname"></div>
      <div id="dtext"></div>
      <div id="dchoices"></div>
    </div>
    <div id="dnext">▼</div>
  </div>
</div>

<div id="book" class="modal hidden">
  <div class="paper">
    <div class="tabs" id="bookTabs"></div>
    <div id="bookBody"></div>
    <div id="bookFoot"><button class="btn" id="bookClose">收好佢</button></div>
  </div>
</div>

<div id="noteModal" class="modal hidden">
  <div class="paper">
    <div id="bookBody2" style="padding:18px;background:#fffaf0"></div>
    <div id="bookFoot2" style="padding:10px 12px;display:flex;justify-content:flex-end;border-top:3px dashed rgba(0,0,0,.15)"><button class="btn" id="noteClose">收埋喺口袋</button></div>
  </div>
</div>

<div id="kui" class="hidden">
  <div id="kTop">
    <div class="panel">⏱ <span id="kTime">60</span></div>
    <div class="panel">💰 今晚小食亭 <b id="kEarn">0</b></div>
    <div class="panel">🍿 已服務 <b id="kServed">0</b></div>
  </div>
  <div id="kBot">
    <div id="kHelp">撳食物整嘢 → 撳客人上菜</div>
    <div id="kTray" class="panel">托盤 <div id="kTraySlots"></div><button class="btn sm ghost" id="kClear">清空</button></div>
    <div id="kBtns"></div>
  </div>
</div>

<div id="title" class="screen hidden">
  <div class="logo">笑笑樂園<small>夜 班 守 則</small></div>
  <div class="sub">SMILEY LAND · NIGHT SHIFT RULES</div>
  <div class="titleBtns">
    <button class="btn" id="btnNew">🎡 開始返工</button>
    <button class="btn cyan hidden" id="btnCont">繼續</button>
  </div>
  <div class="keys">WASD／方向鍵 移動 · E／空白鍵 互動 · R 睇守則<br>手機：左邊拖動行路 · 右下角掣互動</div>
</div>

<div id="morning" class="screen hidden"><div class="mcard panel" id="mcard"></div></div>
<div id="ending" class="screen hidden"><div class="ecard panel" id="ecard"></div></div>
<div id="fade"><div id="fadeTxt"></div></div>
<canvas id="scare" class="hidden" width="64" height="40"></canvas>

<script>
'use strict';
/* ============================================================
   笑笑樂園 · 夜班守則  — a theme-park rule-horror pixel RPG
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];

/* ---------- canvas & scaling ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
const light=document.createElement('canvas'),lctx=light.getContext('2d');
let LW=240,LH=150,SC=4;
function resize(){
  SC=Math.max(2,Math.floor(Math.min(innerWidth/240,innerHeight/150)));
  LW=Math.ceil(innerWidth/SC);LH=Math.ceil(innerHeight/SC);
  cv.width=LW;cv.height=LH;light.width=LW;light.height=LH;
  cv.style.width=LW*SC+'px';cv.style.height=LH*SC+'px';
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

/* ---------- pixel helpers ---------- */
let G=ctx,SIL=null;
function r(x,y,w,h,c){G.fillStyle=SIL||c;G.fillRect(Math.round(x),Math.round(y),w,h);}
function circ(g,cx,cy,rad,c,ry){ // crisp pixel ellipse
  ry=ry??rad;g.fillStyle=c;
  for(let y=-ry;y<=ry;y++){const w=Math.round(rad*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1);}
}
function shadow(g,x,y,w){g.fillStyle='rgba(0,0,0,.35)';circ(g,x,y,w||5,'rgba(0,0,0,.35)',2);}

/* ============================================================
   SPRITES (origin = feet centre)
   ============================================================ */
const SPR={};
SPR.player=o=>{
  const f=o.f||0,wk=o.walk&&(f%2);
  r(-4,-4,3,4,'#33406e');r(1,-4,3,4,'#33406e');
  if(o.walk){wk?r(-4,-2,3,2,'#1f2747'):r(1,-2,3,2,'#1f2747');}

const AU={c:null,m:null,muted:false,mode:'',acc:0,step:0,drone:null,
 init(){if(this.c)return;try{this.c=new(window.AudioContext||window.webkitAudioContext)();this.m=this.c.createGain();this.m.gain.value=.55;this.m.connect(this.c.destination);}catch(e){}},
 tone(f,d=.15,type='square',v=.08,delay=0,slide=0){if(!this.c||this.muted)return;const t=this.c.currentTime+delay,o=this.c.createOscillator(),g=this.c.createGain();
   o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05);},
 noise(d=.3,v=.15,delay=0,hp=0){if(!this.c||this.muted)return;const t=this.c.currentTime+delay,n=this.c.sampleRate*d|0,b=this.c.createBuffer(1,n,this.c.sampleRate),a=b.getChannelData(0);
   for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=this.c.createBufferSource();s.buffer=b;const g=this.c.createGain();g.gain.value=v;
   if(hp){const f=this.c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);}else s.connect(g);g.connect(this.m);s.start(t);},
 sfx(k){switch(k){
   case'pick':this.tone(880,.08,'square',.06);this.tone(1320,.12,'square',.06,.07);break;
   case'coin':this.tone(1046,.06,'square',.05);this.tone(1568,.14,'square',.05,.05);break;
   case'cast':this.tone(784,.5,'sine',.12);this.tone(622,.7,'sine',.12,.35);break;
   case'fcast':this.tone(784,.5,'sine',.12,0,.92);this.tone(600,.9,'sawtooth',.06,.35,.6);this.noise(.4,.05,.2,2000);break;
   case'scare':this.noise(.7,.4);this.tone(90,.8,'sawtooth',.25,0,.3);this.tone(1800,.4,'square',.07,0,.4);break;
   case'hurt':this.tone(220,.25,'sawtooth',.1,0,.5);break;
   case'good':this.tone(523,.1,'triangle',.1);this.tone(659,.1,'triangle',.1,.08);this.tone(784,.2,'triangle',.1,.16);break;
   case'blip':this.tone(660,.04,'square',.03);break;
   case'ding':this.tone(1318,.25,'triangle',.1);break;
   case'wrong':this.tone(160,.25,'square',.08);break;
   case'red':this.tone(55,2.5,'sawtooth',.08);this.tone(58,2.5,'sawtooth',.06);break;
   case'bell':for(let i=0;i<3;i++){this.tone(392,1.6,'sine',.18,i*1.1);this.tone(196,1.6,'sine',.1,i*1.1);}break;
   case'step':this.noise(.03,.03,0,1500);break;
 }},
 setMode(m){if(this.mode===m)return;this.mode=m;this.step=0;this.acc=0;
   if(this.drone){try{this.drone.g.gain.linearRampToValueAtTime(0,this.c.currentTime+.8);this.drone.o.stop(this.c.currentTime+1);this.drone.o2.stop(this.c.currentTime+1);}catch(e){}this.drone=null;}
   if(this.c&&m==='night'){const o=this.c.createOscillator(),o2=this.c.createOscillator(),g=this.c.createGain();o.type='sine';o2.type='sine';o.frequency.value=55;o2.frequency.value=55.6;
     g.gain.value=0;g.gain.linearRampToValueAtTime(this.muted?0:.05,this.c.currentTime+2);o.connect(g);o2.connect(g);g.connect(this.m);o.start();o2.start();this.drone={o,o2,g};}},
 update(dt){if(!this.c||this.muted)return;const m=this.mode;
   const spd={night:.55,kiosk:.17,day:.24,title:.5,end:.6}[m];if(!spd)return;this.acc+=dt;
   while(this.acc>=spd){this.acc-=spd;this.play(m,this.step++);}},
 play(m,s){
   const N=n=>440*Math.pow(2,(n-9)/12);
   if(m==='night'||m==='title'){ // eerie music box: A minor waltz
     const mel=[12,15,19,15,12,null,10,14,17,14,10,null,8,12,15,12,7,11,14,null,12,null,null,null];
     const n=mel[s%mel.length];if(n!=null&&Math.random()<.85)this.tone(N(n+12),.9,'triangle',.035);
     if(s%6===0)this.tone(N([0,-2,-4,-5][(s/6|0)%4]-12),1.8,'sine',.04);
   }else if(m==='kiosk'){
     const ch=[[0,4,7],[9,12,16],[5,9,12],[7,11,14]][(s/8|0)%4];
     if(s%2===0)this.tone(N(ch[0]-12),.18,'triangle',.09);
     if(s%8===4)this.noise(.05,.05,0,3000);
     const arp=[0,1,2,1,2,0,1,2];this.tone(N(ch[arp[s%8]]+12),.12,'square',.025);
     if(s%16===14)this.tone(N(ch[2]+12),.25,'triangle',.05);
   }else if(m==='day'){
     const ch=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]][(s/8|0)%4];
     this.tone(N(ch[s%3]+12),.3,'triangle',.04);if(s%4===0)this.tone(N(ch[0]-12),.4,'sine',.06);
   }else if(m==='end'){
     const mel=[7,9,12,14,12,9,7,4];this.tone(N(mel[s%8]+12),.8,'triangle',.04);if(s%4===0)this.tone(N(0-12),1.6,'sine',.04);
   }
 }
};

   ============================================================ */
function blocked(x,y,rad){
  for(const b of BLOCKS){const cx=clamp(x,b.x,b.x+b.w),cy=clamp(y,b.y,b.y+b.h);if((x-cx)**2+(y-cy)**2<rad*rad)return true;}
  for(const c of CIRCLES){if((x-c.x)**2+(y-c.y)**2<(rad+c.r)**2)return true;}
  return y>WH-4;
}

const MIN_SEC=.5; // real seconds per game minute
function newNight(){
  const N=NIGHTS[S.night];
  const maxSan=100+(S.upg.flask?25:0);
  R={time:0,san:maxSan,maxSan,earned:0,events:N.ev.map(e=>Object.assign({},e,{done:false})),
     busy:false,lampRed:false,redT:0,redGrace:0,redFailed:false,npc:null,bears:null,pickups:[],
     zone:'staff',kioskOpen:false,kioskDone:false,target:null,ferrisSpin:false,ferrisA:0,carouselOn:false,carA:0,
     fakeBell:false,rested:false,gateLock:false,fakeWin:null,dawnSaid:false,kioskEarn:0,events_ok:0,events_bad:0,rt:0,stepT:0,mirrorOn:false};
  // lamps
  const rr=rng(S.night*77+3);
  LAMPS.forEach(l=>{l.lit=rr()>.12;l.fl=rr()<.18?1:0;});
  // pickups
  const rnd=rng(S.night*131+Date.now()%1000);
  let tries=0;
  while(R.pickups.length<13&&tries++<3000){
    let x,y,onPath=rnd()<.55;
    if(onPath){const p=PATHS[rnd()*PATHS.length|0];x=p.x+4+rnd()*(p.w-8);y=p.y+4+rnd()*(p.h-8);}
    else{x=30+rnd()*700;y=30+rnd()*570;}
    if(blocked(x,y,6)||zoneAt(x,y)==='gate')continue;
    if(R.pickups.some(q=>dist(q.x,q.y,x,y)<40))continue;
    const L=LOST[rnd()*LOST.length|0];
    R.pickups.push({x,y,kind:'lost',name:L[0],ic:L[1],v:onPath?4+(rnd()*5|0):9+(rnd()*8|0),ph:rnd()*6});
  }
  const want=[];for(let n=1;n<=S.night;n++)for(const id of NIGHTS[n].notes)if(id!=='F'||n===S.night)if(id!=='badge'||S.night===5)want.push(id);
  for(const id of want){
    if(id==='badge'){if(!S.badge)R.pickups.push({x:NOTE_POS.badge[0],y:NOTE_POS.badge[1],kind:'badge',ph:0});}
    else if(!S.notes[id])R.pickups.push({x:NOTE_POS[id][0],y:NOTE_POS[id][1],kind:'note',id,ph:0});
  }
  P.x=224;P.y=522;P.dir=0;P.face=Math.PI/2;
}

function updatePatrol(dt){
  const paused=D.open||modalOpen()||R.ending;
  if(paused)return;
  R.rt+=dt;
  if(!R.busy||R.lampRed||R.npc)R.time+=dt/MIN_SEC;

  // movement
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
  if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
  if(joy.on){mx=joy.dx;my=joy.dy;}
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}
  const canMove=!R.busy||R.lampRed||R.npc;
  const spd=58*(1+.16*S.upg.shoe);
  P.vx=canMove?mx*spd:0;P.vy=canMove?my*spd:0;
  if(Math.hypot(P.vx,P.vy)>1){
    const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
    if(!blocked(nx,P.y,4))P.x=nx;if(!blocked(P.x,ny,4))P.y=ny;
    const ta=Math.atan2(P.vy,P.vx);let da=ta-P.face;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;P.face+=da*Math.min(1,dt*10);
    P.dir=Math.abs(P.vx)>Math.abs(P.vy)?(P.vx<0?2:3):(P.vy<0?1:0);
    P.ft+=dt;if(P.ft>.14){P.ft=0;P.f++;}P.walk=true;
    R.stepT+=dt;if(R.stepT>.3){R.stepT=0;AU.sfx('step');}

    runScript(async()=>{await talk(['小食亭方向傳嚟好多拍門聲。','嘭、嘭、嘭、嘭——特別客人等得好唔耐煩。']);hurt(30,'你遲咗開檔。');});}

  // events

      const h=EV[e.k];

    break;}}

  else R.san-=.42*(1-.25*S.upg.light)*dt*(R.lampRed?1.6:1);
  if(R.san<=0&&!R.busy){R.san=0;faint();}
  if(R.target&&R.time>R.target.t)R.target=null;
  if(R.ferrisSpin)R.ferrisA+=dt*.35;
  if(R.carouselOn)R.carA+=dt*.9;

  // hint

}

function drawGateArch(g){
  g.fillStyle='#7a2f2a';g.fillRect(332,574,106,12);g.fillStyle='#ffcf3f';g.fillRect(334,576,102,8);
  for(let x=340;x<432;x+=8){g.fillStyle=(x/8)%2?'#e2453c':'#3fa0e0';g.fillRect(x,578,4,4);}
  circ(g,385,571,9,'#ffcf3f');circ(g,385,571,8,'#ffe07a');g.fillStyle='#1d1420';g.fillRect(381,568,2,2);g.fillRect(387,568,2,2);g.fillRect(381,574,8,1);g.fillRect(380,573,1,1);g.fillRect(389,573,1,1);
}
function drawPickup(g,q,t){
  const b=Math.round(Math.sin(t*3+q.ph)*1);
  shadow(g,q.x,q.y+2,3);
  if(q.kind==='note'){g.fillStyle='#fff6e0';g.fillRect(q.x-3,q.y-6+b,7,6);g.fillStyle='#b3261e';g.fillRect(q.x-2,q.y-4+b,5,1);g.fillRect(q.x-2,q.y-2+b,4,1);}
  else if(q.kind==='badge'){g.fillStyle='#fff';g.fillRect(q.x-3,q.y-6+b,7,5);g.fillStyle='#3fa0e0';g.fillRect(q.x-3,q.y-6+b,7,1);g.fillStyle='#caa';g.fillRect(q.x-2,q.y-4+b,2,2);}
  else{g.fillStyle=q.big?'#ffcf3f':'#e8c070';g.fillRect(q.x-2,q.y-5+b,5,4);g.fillStyle='#fff';g.fillRect(q.x-1,q.y-4+b,1,1);}
}
function renderWorld(t,dark,camMode){
  if(!WORLD)buildWorld();
  // camera
  let tx=P.x-LW/2,ty=P.y-10-LH/2;
  if(camMode==='pan'){tx=384+Math.cos(t*.05)*200-LW/2;ty=300+Math.sin(t*.07)*140-LH/2;}
  tx=WW<LW?(WW-LW)/2:clamp(tx,0,WW-LW);ty=WH<LH?(WH-LH)/2:clamp(ty,0,WH-LH);
  cam.x+=(tx-cam.x)*(camMode==='pan'?1:Math.min(1,.15));cam.y+=(ty-cam.y)*(camMode==='pan'?1:.15);
  if(Math.abs(tx-cam.x)>200)cam.x=tx;if(Math.abs(ty-cam.y)>200)cam.y=ty;
  let sx=0,sy=0;if(cam.shake>0){sx=(Math.random()-.5)*6;sy=(Math.random()-.5)*6;}
  const ox=Math.round(cam.x+sx),oy=Math.round(cam.y+sy);
  ctx.fillStyle='#0b0a14';ctx.fillRect(0,0,LW,LH);
  ctx.drawImage(WORLD,-ox,-oy);
  ctx.save();ctx.translate(-ox,-oy);
  const vis=(x,y,m=40)=>x>ox-m&&x<ox+LW+m&&y>oy-m&&y<oy+LH+m+40;
  const L=[];
  for(const tr of TREES)if(vis(tr.x,tr.y))L.push({y:tr.y,d:()=>ctx.drawImage(TREE_IMG[tr.v],tr.x-13,tr.y-27)});
  const red=R&&R.lampRed;
  for(const l of LAMPS)if(vis(l.x,l.y))L.push({y:l.y,d:()=>drawLampPost(ctx,l,red)});
  if(vis(168,330,120))L.push({y:350,d:()=>drawCarousel(ctx,t,R&&R.carouselOn)});
  if(vis(384,100,120))L.push({y:150,d:()=>drawFerris(ctx,t,R&&R.ferrisSpin)});
  L.push({y:700,d:()=>drawGateArch(ctx)});
  if(R){
    for(const q of R.pickups)if(vis(q.x,q.y))L.push({y:q.y,d:()=>drawPickup(ctx,q,t)});
    const npc=R.npc||R.npcShow;
    if(npc)L.push({y:npc.y,d:()=>{shadow(ctx,npc.x,npc.y,4);drawChar(ctx,npc.type,npc.x,npc.y,{flip:npc.x>P.x});}});
    if(R.bears)for(const b of R.bears)L.push({y:b.y,d:()=>{shadow(ctx,b.x,b.y,7);drawChar(ctx,'bear',b.x,b.y,{smile:b.smile});}});
    if(R.redGhost){const gx=P.x+Math.cos(R.redGhost.a)*40,gy=P.y+Math.sin(R.redGhost.a)*26;L.push({y:gy,d:()=>drawChar(ctx,'stranger',gx,gy,{alpha:.75})});}
    if(R.mirrorOn)L.push({y:300,d:()=>{ctx.fillStyle='#8a96a8';ctx.fillRect(712,280,8,22);ctx.fillStyle='#c8d4e4';ctx.fillRect(713,281,6,20);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(714,283,1,8);}});
  }
  if(PHASE==='endscene'&&END_MING)L.push({y:600,d:()=>{shadow(ctx,400,600,5);drawChar(ctx,'ming',400,600,{real:true,alpha:END_MING});}});
  if(PHASE==='patrol'||PHASE==='brief'||PHASE==='endscene'){
    L.push({y:P.y,d:()=>{shadow(ctx,P.x,P.y,5);drawChar(ctx,'player',P.x,P.y+(P.walk&&P.f%2?-1:0),{f:P.f,walk:P.walk,dir:P.dir});}});
  }
  L.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  ctx.restore();

  // lighting
  if(dark>0){
    lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,LW,LH);
    lctx.fillStyle=red?`rgba(30,0,6,${Math.min(.97,dark+.04)})`:`rgba(6,5,20,${dark})`;lctx.fillRect(0,0,LW,LH);
    lctx.globalCompositeOperation='destination-out';
    const hole=(x,y,rad,a=1)=>{const g=lctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(.55,`rgba(0,0,0,${a*.6})`);g.addColorStop(1,'rgba(0,0,0,0)');lctx.fillStyle=g;lctx.fillRect(x-rad,y-rad,rad*2,rad*2);};
    for(const l of LAMPS){if(!l.lit||(l.fl&&l.on===false))continue;const x=l.x-ox,y=l.y-oy-8;if(x<-60||x>LW+60||y<-60||y>LH+60)continue;hole(x,y+6,red?30:44,red?.7:.95);}
    if(PHASE!=='title'&&PHASE!=='morning'){
      const px=P.x-ox,py=P.y-oy-8;hole(px,py,22,.9);
      const cr=(86+S.upg.light*26),a=P.face,sp=.5;
      const g=lctx.createRadialGradient(px,py,4,px,py,cr);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.7,'rgba(0,0,0,.7)');g.addColorStop(1,'rgba(0,0,0,0)');
      lctx.fillStyle=g;lctx.beginPath();lctx.moveTo(px,py);lctx.arc(px,py,cr,a-sp,a+sp);lctx.closePath();lctx.fill();
    }else if(PHASE==='title'){for(const[x,y]of[[384,92],[168,300]])hole(x-ox,y-oy,90,.6);}
    hole(384-ox,96-oy,R&&R.ferrisSpin?60:0,.5);
    ctx.drawImage(light,0,0);
    // coloured glow
    ctx.globalCompositeOperation='lighter';
    for(const l of LAMPS){if(!l.lit||(l.fl&&l.on===false))continue;const x=l.x-ox,y=l.y-oy-18;if(x<-50||x>LW+50||y<-50||y>LH+50)continue;
      const g=ctx.createRadialGradient(x,y,0,x,y,red?34:26);g.addColorStop(0,red?'rgba(255,30,30,.5)':'rgba(255,190,90,.28)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-40,y-40,80,80);}
    ctx.globalCompositeOperation='source-over';
    // glints for pickups (visible in dark)
    if(R)for(const q of R.pickups){const x=q.x-ox,y=q.y-oy-4;if(x<0||x>LW||y<0||y>LH)continue;const tw=(Math.sin(t*4+q.ph*3)+1)/2;
      if(tw>.6){ctx.fillStyle=q.kind==='note'?'#ff5a4a':q.kind==='badge'?'#7fd0ff':'#ffe9a0';ctx.fillRect(x,y-1,1,3);ctx.fillRect(x-1,y,3,1);}}
  }
  // target arrow
  if(R&&R.target&&PHASE==='patrol'){
    const x=R.target.x-ox,y=R.target.y-oy-12;
    if(x>8&&x<LW-8&&y>8&&y<LH-8){const b=Math.round(Math.sin(t*6)*2);ctx.fillStyle='#ffcf3f';ctx.fillRect(x-3,y-8+b,7,2);ctx.fillRect(x-2,y-6+b,5,2);ctx.fillRect(x-1,y-4+b,3,2);}
    else{const a=Math.atan2(y-LH/2,x-LW/2),ex=LW/2+Math.cos(a)*(LW/2-12),ey=LH/2+Math.sin(a)*(LH/2-12);
      ctx.save();ctx.translate(Math.round(ex),Math.round(ey));ctx.rotate(a);ctx.fillStyle='#ffcf3f';ctx.fillRect(-3,-1,6,3);ctx.fillRect(1,-3,2,7);ctx.fillRect(3,-2,2,5);ctx.fillRect(5,0,1,1);ctx.restore();}
  }
  if(cam.shake>0)cam.shake-=1/60;
}

    d.innerHTML=`<div class="ic">${u.ic}</div><div class="tx"><b>${u.n}${u.consum?' ×'+S.charms:(u.cost.length>1?' Lv'+lv:'')}</b>${u.d}</div>`;

}

  if(PHASE==='patrol'&&R)updatePatrol(dt);
  if(PHASE==='kiosk'&&K)updateKiosk(dt);
  if(PHASE==='kiosk'&&K)renderKiosk(T);
  else{
    let dark=.9;
    if(PHASE==='title')dark=.78;else if(PHASE==='morning'||PHASE==='ending')dark=0;
    else if(PHASE==='endscene')dark=.1;
    else if(R&&R.time>440)dark=.9*clamp((480-R.time)/40,0.12,1);
    renderWorld(T,dark,(PHASE==='title'||PHASE==='morning'||PHASE==='ending')?'pan':'follow');
  }
  updateHUD();
  requestAnimationFrame(loop);
}
buildWorld();title();requestAnimationFrame(loop);
</script>
