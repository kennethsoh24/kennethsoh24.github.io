name: Android APK
on:
  workflow_dispatch:   # built on request only (not on every web change)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save three@0.170.0
      - run: python3 android/prepare_www.py
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk chess-fantasia.apk && ls -la chess-fantasia.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Chess Fantasia — Android
          body: "Latest Android build of Chess Fantasia (offline). Download **chess-fantasia.apk** on your phone, open it and allow installing from this source."
          prerelease: false
          make_latest: true
          files: chess-fantasia.apk
