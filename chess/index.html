<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess Fantasia — choose your edition</title>
<meta name="description" content="Chess Fantasia — 3D chess where every piece transforms. Two editions: Mono and Moonlit.">
<meta property="og:image" content="assets/keyart_moon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0d0d; }
  main { display: flex; height: 100%; }
  a.ed { position: relative; flex: 1; display: block; overflow: hidden; text-decoration: none; transition: flex .6s cubic-bezier(.2,1,.2,1); }
  a.ed:hover, a.ed:focus-visible { flex: 1.45; outline: none; }
  a.ed .art { position: absolute; inset: 0; background-size: cover; transition: transform 1.2s cubic-bezier(.2,1,.2,1), filter .4s; }
  a.ed:hover .art { transform: scale(1.05); }
  .mono { background: #f2f1ed; color: #0d0d0d; }
  .mono .art { background-image: url(assets/keyart.jpg); background-position: center 70%; filter: contrast(1.05); opacity: .9; }
  .mono .art::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px); }
  .moon { background: #030b1f; color: #eaf8ff; }
  .moon .art { background-image: url(assets/keyart_moon.jpg); background-position: 70% 50%; }
  .moon .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(3,11,31,.85), transparent 55%); }
  .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 4vw 34px; display: grid; gap: 10px; }
  .mono .label { background: linear-gradient(0deg, #f2f1ed 70%, transparent); }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  .mono h2 { margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 62%; font-size: clamp(54px, 7vw, 110px); line-height: .82; text-transform: uppercase; }
  .mono h2 span { display: block; font-weight: 300; font-stretch: 100%; font-size: .5em; margin-top: .08em; }
  .moon img { width: min(460px, 80%); filter: drop-shadow(0 0 18px rgba(79,224,255,.5)); }
  .enter { justify-self: start; font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; padding: 10px 20px; }
  .mono .enter { background: #0d0d0d; color: #fff; }
  .moon .enter { font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 900; font-size: 20px; letter-spacing: .1em; color: #030b1f; background: #4fe0ff; transform: skewX(-12deg); box-shadow: 5px 5px 0 #1d6cff; }
  .moon .tag { color: #4fe0ff; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 800; font-size: 15px; }
  .no { position: absolute; top: 22px; left: 4vw; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 62%; font-size: 64px; line-height: 1; }
  .moon .no { font-family: "Barlow Condensed", sans-serif; font-style: italic; color: #4fe0ff; text-shadow: 0 0 14px rgba(79,224,255,.6); }
  .divider { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); color: #fff; background: #0d0d0d; padding: 6px 14px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .3em; pointer-events: none; mix-blend-mode: difference; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    .divider { display: none; }
    .no { font-size: 44px; top: 14px; }
    .mono h2 { font-size: 52px; }
  }
</style>
</head>
<body>
<main>
  <a class="ed mono" href="mono/">
    <div class="art"></div>
    <div class="no">01</div>
    <div class="label">
      <span class="tag">Edition 01 — Mono · black &amp; white broadcast</span>
      <h2>Chess<span>Fantasia</span></h2>
      <span class="enter">Enter →</span>
    </div>
  </a>
  <a class="ed moon" href="moonlit/">
    <div class="art"></div>
    <div class="no">02</div>
    <div class="label">
      <span class="tag">Edition 02 — Moonlit · night ocean</span>
      <img src="assets/logo_moon.webp" alt="Chess Fantasia">
      <span class="enter">Enter ›</span>
    </div>
  </a>
</main>
<div class="divider">Choose your edition</div>
</body>
</html>
