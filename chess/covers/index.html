<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Chess Fantasia — Covers</title>
<style>
  :root { --bg: #07080a; --ink: #e9edf2; --dim: #7d848c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Helvetica Neue", Arial, sans-serif; }
  header { padding: 28px 16px 8px; text-align: center; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .3em; font-weight: 300; }
  header p { margin: 6px 0 0; color: var(--dim); letter-spacing: .12em; font-size: 12px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding: 20px 16px 40px; max-width: 1400px; margin: 0 auto; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 12px; letter-spacing: .08em; }
  figcaption span { color: var(--dim); }
  a { color: var(--ink); }
  footer { text-align: center; padding: 0 16px 40px; color: var(--dim); font-size: 12px; }
  main.icons { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  main.icons img { aspect-ratio: 1; border-radius: 22%; }
  main.icons figure:hover img { border-radius: 50%; transition: border-radius .3s; }
</style>
</head>
